<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entorno de Pruebas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .status {
            display: inline-block;
            background-color: #e6f4ea;
            color: #137333;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 1.75rem;
            margin-bottom: 0.75rem;
            color: #1a1a1a;
        }
        p {
            color: #666;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="status">● Servidor Activo</span>
        <h1>Index de Prueba</h1>
        <p>El entorno web se ha cargado correctamente y está listo para recibir peticiones o scripts.</p>
        <button id="btnTest">Probar JavaScript</button>
    </div>

    <script>
        document.getElementById('btnTest').addEventListener('click', () => {
            alert('¡El motor de JS y los eventos funcionan perfectamente!');
            console.log('Test ejecutado exitosamente en:', new Date().toLocaleTimeString());
        });
    </script>
</body>
</html>
